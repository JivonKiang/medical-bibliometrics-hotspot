<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="dna1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dna2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Open book shape -->
  <g transform="translate(256,256)" opacity="0.15">
    <!-- Left page -->
    <path d="M-8,40 L-8,-120 Q-100,-110 -120,-30 L-120,40 Z" fill="#38bdf8"/>
    <!-- Right page -->
    <path d="M8,40 L8,-120 Q100,-110 120,-30 L120,40 Z" fill="#38bdf8"/>
    <!-- Center fold -->
    <line x1="0" y1="-125" x2="0" y2="45" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- DNA Helix - Left strand -->
  <path d="M140,420 Q110,340 170,260 Q230,180 140,100"
        fill="none" stroke="url(#dna1)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M140,100 Q110,180 170,260 Q230,340 140,420"
        fill="none" stroke="url(#dna1)" stroke-width="14" stroke-linecap="round" opacity="0.4"/>

  <!-- DNA Helix - Right strand -->
  <path d="M372,420 Q342,340 402,260 Q462,180 372,100"
        fill="none" stroke="url(#dna2)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M372,100 Q342,180 402,260 Q462,340 372,420"
        fill="none" stroke="url(#dna2)" stroke-width="14" stroke-linecap="round" opacity="0.4"/>

  <!-- Cross-bridges (base pairs) -->
  <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="163" y1="145" x2="349" y2="145"/>
    <line x1="151" y1="220" x2="361" y2="220"/>
    <line x1="163" y1="305" x2="349" y2="305"/>
    <line x1="192" y1="375" x2="320" y2="375"/>
  </g>

  <!-- Data dots at bridge ends -->
  <g fill="#fbbf24">
    <circle cx="163" cy="145" r="6"/>
    <circle cx="349" cy="145" r="6"/>
    <circle cx="151" cy="220" r="6"/>
    <circle cx="361" cy="220" r="6"/>
    <circle cx="163" cy="305" r="6"/>
    <circle cx="349" cy="305" r="6"/>
    <circle cx="192" cy="375" r="6"/>
    <circle cx="320" cy="375" r="6"/>
  </g>

  <!-- Pulse wave overlay - data signal -->
  <path d="M80,420 L130,420 L150,360 L170,440 L190,380 L210,420 L260,420"
        fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  
  <!-- Sparkle dots -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="280" cy="130" r="3"/>
    <circle cx="420" cy="180" r="2.5"/>
    <circle cx="90" cy="300" r="2"/>
    <circle cx="430" cy="350" r="3"/>
    <circle cx="110" cy="170" r="2"/>
  </g>
</svg>