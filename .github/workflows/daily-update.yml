name: Weekly Content Refresh
on:
  schedule:
    - cron: '0 2 * * 1'   # UTC 02:00 (北京时间 10:00)
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          sed -i "s/Updated .*/Updated $(date -u +'%b %Y')/" index.html

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "daily: refresh timestamp"
          git push