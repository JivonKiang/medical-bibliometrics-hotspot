<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公共数据库发文套路图谱</title>
<style>
:root {
  --bg: #f8f6f2;
  --surface: #ffffff;
  --text: #2c2c2c;
  --text-muted: #6b6b6b;
  --text-faint: #9e9e9e;
  --border: #e8e3dc;
  --navy: #1a2a40;
  --navy-light: #263a54;
  --navy-dark: #0f1b2b;
  --gold: #b8860b;
  --gold-light: #f5e6c8;
  --accent: #3b6b8b;
  --accent-light: #e2ecf3;
  --sage: #5a7a6a;
  --rose: #8b4751;
  --slate: #5b6778;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
  --sidebar-w: 280px;
  --nav-h: 56px;
  --font-heading: "Georgia", "Times New Roman", "Noto Serif SC", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1d22;
    --surface: #24272c;
    --text: #e4e4e4;
    --text-muted: #a0a0a0;
    --text-faint: #6e6e6e;
    --border: #34373c;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    --accent-light: #243540;
    --gold-light: #3a3020;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ========== MOBILE NAV BAR ========== */
.mobile-nav {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: var(--nav-h);
  background: var(--navy);
  color: #fff;
  align-items: center; justify-content: space-between;
  padding: 0 16px;
  box-shadow: var(--shadow-lg);
}
.mobile-nav .logo { font-family: var(--font-heading); font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
.mobile-nav .menu-btn {
  background: none; border: none; color: #fff; font-size: 24px;
  cursor: pointer; width: 44px; height: 44px; display: flex;
  align-items: center; justify-content: center;
  border-radius: var(--radius);
}
.mobile-nav .menu-btn:hover { background: rgba(255,255,255,0.1); }

/* ========== SIDEBAR (Desktop) ========== */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--navy);
  color: #d5dde5;
  z-index: 100;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 2px 0 24px rgba(0,0,0,0.15);
}

.sidebar-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.sidebar-header h2 {
  font-family: var(--font-heading);
  font-size: 18px; font-weight: 700; color: #fff;
  letter-spacing: 0.5px;
}
.sidebar-header .sub { font-size: 12px; color: #8899aa; margin-top: 4px; }

.sidebar-nav {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 8px 0 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.15) transparent;
}
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

/* Category toggle */
.cat-toggle {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 10px 20px 6px;
  background: none; border: none; color: #8899aa;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.2px; cursor: pointer; text-align: left;
  transition: color 0.2s;
  font-family: var(--font-body);
}
.cat-toggle:hover { color: #c0d0e0; }
.cat-toggle .arrow {
  display: inline-block; transition: transform 0.25s ease;
  font-size: 10px; width: 12px; text-align: center;
}
.cat-toggle.collapsed .arrow { transform: rotate(-90deg); }

.cat-group { overflow: hidden; transition: max-height 0.35s ease, opacity 0.25s ease; }
.cat-group.collapsed { max-height: 0 !important; opacity: 0; }

.cat-group a {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 20px 7px 36px;
  font-size: 13px; color: #a0b0c0;
  text-decoration: none;
  transition: all 0.15s;
  border-left: 2px solid transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cat-group a:hover { color: #e8f0f8; background: rgba(255,255,255,0.04); }
.cat-group a.active {
  color: var(--gold); border-left-color: var(--gold);
  background: rgba(255,255,255,0.05);
}
.cat-group a .dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}

.sidebar-footer {
  flex-shrink: 0;
  padding: 12px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 11px; color: #667788;
}

/* ========== MOBILE DRAWER ========== */
.drawer-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 190;
  background: rgba(0,0,0,0.5);
  opacity: 0; transition: opacity 0.3s;
}
.drawer-overlay.open { opacity: 1; }

.mobile-drawer {
  display: none;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 195;
  width: 280px; max-width: 85vw;
  background: var(--navy);
  color: #d5dde5;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  flex-direction: column;
  overflow-y: auto;
}
.mobile-drawer.open { transform: translateX(0); }

.drawer-header {
  padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: space-between;
}
.drawer-header h2 { font-family: var(--font-heading); font-size: 17px; color: #fff; }
.drawer-close {
  background: none; border: none; color: #8899aa; font-size: 20px;
  cursor: pointer; width: 36px; height: 36px; display: flex;
  align-items: center; justify-content: center; border-radius: 50%;
}
.drawer-close:hover { background: rgba(255,255,255,0.1); color: #fff; }

.drawer-nav { padding: 8px 0 20px; }
.drawer-nav .cat-toggle { padding: 10px 20px 4px; color: #8899aa; }
.drawer-nav .cat-group a { padding: 8px 20px 8px 36px; font-size: 14px; }

/* ========== MAIN CONTENT ========== */
.main {
  margin-left: var(--sidebar-w);
  padding: 32px 40px 80px;
  max-width: 1100px;
}

/* Section divider */
.section-divider {
  height: 1px;
  background: var(--border);
  margin: 40px 0;
  position: relative;
}
.section-divider::after {
  content: '';
  position: absolute; top: -1px; left: 0;
  width: 60px; height: 2px;
  background: var(--accent);
}

/* ========== DASHBOARD ========== */
.dashboard { margin-bottom: 10px; }
.dashboard h1 {
  font-family: var(--font-heading);
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 700; color: var(--navy);
  letter-spacing: -0.3px;
}
@media (prefers-color-scheme: dark) { .dashboard h1 { color: #d5dde5; } }

.dashboard .subtitle {
  font-size: 14px; color: var(--text-muted);
  margin-top: 4px; margin-bottom: 28px;
}

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-card .stat-val {
  font-family: var(--font-heading);
  font-size: 28px; font-weight: 700;
  color: var(--navy);
}
@media (prefers-color-scheme: dark) { .stat-card .stat-val { color: #d5dde5; } }
.stat-card .stat-label {
  font-size: 12px; color: var(--text-muted); margin-top: 2px;
}
.stat-card.accent { border-color: var(--accent); }
.stat-card.accent .stat-val { color: var(--accent); }

/* Overview table */
.ov-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.ov-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.ov-table thead { background: var(--navy); color: #d5dde5; }
.ov-table th {
  padding: 10px 14px; text-align: left;
  font-weight: 600; font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.5px; white-space: nowrap;
}
.ov-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.ov-table tbody tr:hover { background: rgba(0,0,0,0.02); }
.ov-table tbody tr:last-child td { border-bottom: none; }
.ov-table a { color: var(--navy); text-decoration: none; font-weight: 600; }
.ov-table a:hover { color: var(--accent); }
@media (prefers-color-scheme: dark) { .ov-table a { color: #b0c8e0; } }

.tag {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
}
.tag-causal { background: #e8e0f0; color: #5b3d8c; }
.tag-clinical-db { background: #dae8f5; color: #2b5f8a; }
.tag-survey { background: #d5ece4; color: #3a7045; }
.tag-cohort { background: #f5e0e0; color: #8b3a3a; }
.tag-clinical { background: #f5eed5; color: #7a6020; }
.tag-stats { background: #f0dbe8; color: #8b3a6a; }
.tag-bioinfo { background: #d5e8f0; color: #2b6a8a; }
.tag-bioinfo-adv { background: #f5e0cc; color: #8a5020; }
.tag-imaging { background: #e8d5f0; color: #6a3a8b; }
.tag-tcm { background: #d5efe8; color: #3a7055; }
.tag-ai { background: #f0d5f0; color: #8a3a8a; }
.tag-biblio { background: #e8e8e8; color: #5a5a5a; }

.stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
.dif-text { font-size: 11px; color: var(--text-muted); margin-left: 4px; }

.if-range { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
.cas-text { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

/* ========== ROUTINE DETAIL SECTIONS ========== */
.routine-section {
  margin-top: 24px;
}
.routine-section:first-of-type { margin-top: 16px; }

.rt-header {
  display: flex; align-items: flex-start; gap: 14px;
  margin-bottom: 18px;
}
.rt-icon {
  width: 44px; height: 44px; border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: #fff; font-size: 18px; font-weight: 700;
}
.rt-header h3 {
  font-family: var(--font-heading);
  font-size: 20px; font-weight: 700;
  color: var(--navy);
  line-height: 1.3;
}
@media (prefers-color-scheme: dark) { .rt-header h3 { color: #d5dde5; } }
.rt-header .rt-meta { display: flex; gap: 8px; margin-top: 4px; align-items: center; flex-wrap: wrap; }

.rt-metrics {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.rt-metrics .m {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 14px;
  text-align: center; min-width: 64px;
}
.rt-metrics .m .mv { font-size: 18px; font-weight: 700; color: var(--navy); }
.rt-metrics .m .ml { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
@media (prefers-color-scheme: dark) { .rt-metrics .m .mv { color: #d5dde5; } }

.rt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
  margin-bottom: 18px;
}
.rt-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.rt-card h4 {
  font-size: 13px; font-weight: 600; color: var(--navy);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
@media (prefers-color-scheme: dark) { .rt-card h4 { color: #d5dde5; } }
.rt-card p, .rt-card ul { font-size: 13px; color: var(--text-muted); line-height: 1.7; }
.rt-card ul { padding-left: 18px; }
.rt-card ul li { margin-bottom: 4px; }
.rt-card .step-list { list-style: none; padding-left: 0; }
.rt-card .step-list li {
  padding: 4px 0; font-size: 12px; color: var(--text);
  border-bottom: 1px dotted var(--border);
}
.rt-card .step-list li .si {
  display: inline-block; width: 18px; height: 18px; line-height: 18px;
  text-align: center; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  font-size: 10px; font-weight: 700; margin-right: 8px;
}

/* Journal table */
.jnl-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.jnl-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.jnl-table thead { background: #f5f3ee; }
@media (prefers-color-scheme: dark) { .jnl-table thead { background: #2a2d32; } }
.jnl-table th {
  padding: 9px 14px; text-align: left;
  font-weight: 600; color: var(--text-muted); font-size: 11px;
}
.jnl-table td {
  padding: 9px 14px; border-bottom: 1px solid var(--border);
}
.jnl-table tbody tr:last-child td { border-bottom: none; }
.jnl-if { font-weight: 700; font-family: var(--font-mono); }
.cas-q1 { color: #1a5c2a; background: #d4f0dc; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.cas-q2 { color: #5a5a1a; background: #f0f0d4; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.cas-q3 { color: #7a5020; background: #f0e0cc; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.cas-q4 { color: #7a3030; background: #f0d4d4; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }

/* ========== RESPONSIVE ========== */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .mobile-nav { display: flex; }
  .mobile-drawer { display: flex; }
  .drawer-overlay { display: block; }
  .main {
    margin-left: 0;
    padding: calc(var(--nav-h) + 14px) 14px 60px;
    max-width: 100%;
  }
  .rt-grid { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(3, 1fr); }
  .ov-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .ov-table { font-size: 12px; }
  .ov-table th, .ov-table td { padding: 8px 10px; }
  .jnl-wrap { overflow-x: auto; }
  .jnl-table { min-width: 600px; }
  .rt-metrics .m { min-width: 56px; padding: 6px 10px; }
  .rt-metrics .m .mv { font-size: 16px; }
  .section-divider { margin: 28px 0; }
  .rt-card { padding: 14px; }
}

@media (max-width: 480px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat-card { padding: 12px; }
  .stat-card .stat-val { font-size: 22px; }
  .dashboard h1 { font-size: 20px; }
}
</style>
</head>

function parseIF(s) {
  try { return parseFloat(s.replace(/[+>]/g,'').trim()); }
  catch { return 0; }
}

function starHTML(n) {
  return "&#9733;".repeat(n) + "&#9734;".repeat(5-n);
}

function difLabel(n) {
  return {1:"极易",2:"简单",3:"中等",4:"困难",5:"极难"}[n]||"";
}

function casClass(cas) {
  if (cas.includes("1区")) return "cas-q1";
  if (cas.includes("2区")) return "cas-q2";
  if (cas.includes("3区")) return "cas-q3";
  return "cas-q4";
}

function buildSidebar() {
  let h = '<a href="#dashboard" class="cat-group" style="display:block;padding:9px 20px;font-size:13px;color:#a0b0c0;text-decoration:none;border-left:2px solid transparent;">&#8212; 全景总览</a>';
  CATEGORIES.forEach((cat, ci) => {
    h += `<button class="cat-toggle" data-cat="${cat.id}" aria-expanded="true"><span class="arrow">&#9660;</span>${cat.name}</button>`;
    const itemCount = cat.ids.length;
    h += `<div class="cat-group" id="cg-${cat.id}" style="max-height:${itemCount * 36 + 4}px">`;
    cat.ids.forEach(rid => {
      const r = rmap[rid];
      if (!r) return;
      h += `<a href="#${rid}" data-rid="${rid}"><span class="dot" style="background:${cat.color}"></span>${r.name}</a>`;
    });
    h += '</div>';
  });
  document.getElementById('sidebarNav').innerHTML = h;
  document.getElementById('drawerNav').innerHTML = h;
}

  h += `<section id="dashboard" class="dashboard">`;
  h += `<h1>公共数据库发文套路图谱</h1>`;
  h += `<p class="subtitle">覆盖 ${ROUTINES.length} 种套路，从成文难度 / 发文难度 / 期刊IF / 中科院分区 / 创新性 / 热度六大维度综合评估。点击左侧导航直达各套路详情，点击分类箭头折叠/展开。</p>`;

  // Stats
  const avgWrite = (ROUTINES.reduce((s,r)=>s+r.difficulty_write,0)/ROUTINES.length).toFixed(1);
  const avgPub = (ROUTINES.reduce((s,r)=>s+r.difficulty_pub,0)/ROUTINES.length).toFixed(1);
  const maxIF = Math.max(...ROUTINES.map(r=>parseIF(r.journals[0].if)));
  const totalCats = new Set(ROUTINES.map(r=>r.category)).size;

  h += `<div class="stats-row">`;
  h += `<div class="stat-card accent"><div class="stat-val">${ROUTINES.length}</div><div class="stat-label">套路总数</div></div>`;
  h += `<div class="stat-card"><div class="stat-val">${totalCats}</div><div class="stat-label">类别覆盖</div></div>`;
  h += `<div class="stat-card"><div class="stat-val">${avgWrite}<span style="font-size:14px;color:var(--text-muted)">/5</span></div><div class="stat-label">平均成文难度</div></div>`;
  h += `<div class="stat-card"><div class="stat-val">${avgPub}<span style="font-size:14px;color:var(--text-muted)">/5</span></div><div class="stat-label">平均发文难度</div></div>`;
  h += `<div class="stat-card"><div class="stat-val">${maxIF.toFixed(1)}</div><div class="stat-label">最高可投IF</div></div>`;
  h += `</div>`;

  // Overview table
  h += `<div class="ov-wrap" style="max-height:65vh;overflow-y:auto"><table class="ov-table"><thead><tr>`;
  ["套路名称","类别","成文难度","发文难度","创新性","热度","IF范围","中科院分区"].forEach(th=>{
    h += `<th>${th}</th>`;
  });
  h += `</tr></thead><tbody>`;

  ROUTINES.forEach(r=>{
    const cat = r.category;
    const minIF = Math.min(...r.journals.map(j=>parseIF(j.if)));
    const maxJF = Math.max(...r.journals.map(j=>parseIF(j.if)));
    const cases = [...new Set(r.journals.map(j=>j.cas))].join(" / ");

    h += `<tr>`;
    h += `<td><a href="#${r.id}">${r.name}</a></td>`;
    h += `<td><span class="tag ${tag_class[cat]||'tag-biblio'}">${cat}</span></td>`;
    h += `<td><span class="stars">${starHTML(r.difficulty_write)}</span><span class="dif-text">${difLabel(r.difficulty_write)}</span></td>`;
    h += `<td><span class="stars">${starHTML(r.difficulty_pub)}</span><span class="dif-text">${difLabel(r.difficulty_pub)}</span></td>`;
    h += `<td><span class="stars">${starHTML(r.innovation)}</span></td>`;
    h += `<td><span class="stars">${starHTML(r.hotness)}</span></td>`;
    h += `<td class="if-range">${minIF.toFixed(1)} ~ ${maxJF.toFixed(1)}</td>`;
    h += `<td class="cas-text">${cases}</td>`;
    h += `</tr>`;
  });
  h += `</tbody></table></div></section>`;

  // Divider
  h += `<div class="section-divider"></div>`;

  // Detail sections
  ROUTINES.forEach(r=>{
    const cat = r.category;
    h += `<section id="${r.id}" class="routine-section">`;
    h += `<div class="rt-header">`;
    h += `<div class="rt-icon" style="background:var(--navy)">${icons[cat]||cat[0]}</div>`;
    h += `<div><h3>${r.name}</h3><div class="rt-meta"><span class="tag ${tag_class[cat]||'tag-biblio'}">${cat}</span></div></div>`;
    h += `</div>`;

    // Metrics
    h += `<div class="rt-metrics">`;
    h += `<div class="m"><div class="mv">${r.difficulty_write}/5</div><div class="ml">成文难度</div></div>`;
    h += `<div class="m"><div class="mv">${r.difficulty_pub}/5</div><div class="ml">发文难度</div></div>`;
    h += `<div class="m"><div class="mv">${r.innovation}/5</div><div class="ml">创新性</div></div>`;
    h += `<div class="m"><div class="mv">${r.hotness}/5</div><div class="ml">热度</div></div>`;
    h += `</div>`;

    // Grid
    h += `<div class="rt-grid">`;
    h += `<div class="rt-card"><h4>核心套路</h4><p>${r.core}</p></div>`;
    h += `<div class="rt-card"><h4>常用数据库</h4><ul>${r.databases.map(d=>`<li>${d}</li>`).join('')}</ul></div>`;
    h += `<div class="rt-card"><h4>分析流程</h4><ul class="step-list">${r.flow.map((s,i)=>`<li><span class="si">${i+1}</span>${s}</li>`).join('')}</ul></div>`;
    h += `</div>`;

    // Journal table
    h += `<div class="jnl-wrap"><table class="jnl-table"><thead><tr><th>期刊名称</th><th>影响因子</th><th>中科院分区</th><th>发文量</th><th>时间范围</th></tr></thead><tbody>`;
    r.journals.forEach(j=>{
      h += `<tr><td style="font-weight:600">${j.name}</td><td class="jnl-if">${j.if}</td><td><span class="${casClass(j.cas)}">${j.cas}</span></td><td>${j.pub_count}</td><td>${j.period}</td></tr>`;
    });
    h += `</tbody></table></div>`;

    h += `</section>`;
    h += `<div class="section-divider"></div>`;
  });

  // Remove last divider
  h = h.replace(/<div class="section-divider"><\/div>\s*$/, '');

  document.getElementById('mainContent').innerHTML = h;
}

// ========== CATEGORY TOGGLE ==========
function setupToggles() {
  document.querySelectorAll('.cat-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const catId = btn.dataset.cat;
      const group = document.getElementById('cg-' + catId);
      const isCollapsed = btn.classList.toggle('collapsed');
      group.classList.toggle('collapsed');
      btn.setAttribute('aria-expanded', !isCollapsed);
    });
  });
}

// ========== MOBILE MENU ==========
function setupMobile() {
  const overlay = document.getElementById('drawerOverlay');
  const drawer = document.getElementById('mobileDrawer');
  const menuBtn = document.getElementById('menuBtn');
  const closeBtn = document.getElementById('drawerClose');

  function openDrawer() {
    overlay.classList.add('open');
    drawer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    overlay.classList.remove('open');
    drawer.classList.remove('open');
    document.body.style.overflow = '';
  }

  menuBtn.addEventListener('click', openDrawer);
  closeBtn.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);

  // Close drawer when link clicked
  document.getElementById('drawerNav').addEventListener('click', (e) => {
    if (e.target.tagName === 'A') {
      setTimeout(closeDrawer, 200);
    }
  });
}

// ========== ACTIVE LINK TRACKING ==========
function setupActiveTracking() {
  const sections = [];
  document.querySelectorAll('.routine-section').forEach(s => sections.push(s));
  const dashEl = document.getElementById('dashboard');

  function updateActive() {
    const scrollY = window.scrollY + 100;
    let current = 'dashboard';

    for (const s of sections) {
      if (s.offsetTop <= scrollY) current = s.id;
    }

    document.querySelectorAll('#sidebarNav a, #drawerNav a').forEach(a => {
      a.classList.toggle('active', a.dataset.rid === current || a.getAttribute('href') === '#' + current);
    });
  }

  window.addEventListener('scroll', updateActive, { passive: true });
}

// ========== INIT ==========
buildSidebar();
buildMain();
setupToggles();
setupMobile();
setupActiveTracking();

// Re-setup toggles for drawer nav
document.getElementById('drawerNav').querySelectorAll('.cat-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const catId = btn.dataset.cat;
    const group = document.getElementById('cg-' + catId);
    btn.classList.toggle('collapsed');
    group.classList.toggle('collapsed');
  });
});
</script>
