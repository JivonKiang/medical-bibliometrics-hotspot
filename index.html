<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>公共数据库发文套路图谱</title>
<style>
:root{
  --bg:#f9f7f3;--surface:#fff;--text:#2b2b2b;--text-muted:#6e6e6e;--text-faint:#999;
  --border:#e6e0d8;--navy:#162236;--gold:#b8860b;--gold-bg:#fdf3dc;
  --accent:#2d6a8a;--accent-bg:#e8f2f8;--green:#1a6b3a;--red:#c0392b;
  --radius:6px;--radius-lg:10px;--shadow-sm:0 1px 3px rgba(0,0,0,0.05);
  --sidebar-w:272px;--nav-h:52px;
  --ff-h:"Georgia","Noto Serif SC","Songti SC",serif;
  --ff-b:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --ease:0.22s cubic-bezier(0.22,1,0.36,1);
  --deep-blue:#0d4780;--shallow-blue:#1a6d9a;--shore-blue:#3d8eaa;--red-sea:#c0392b;--grey-sea:#888;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#181b1f;--surface:#212428;--text:#e4e4e4;--text-muted:#999;--text-faint:#666;--border:#33363a;--gold-bg:#2a2218;--accent-bg:#1a2730}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--ff-b);background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}

.mob-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:300;height:var(--nav-h);background:var(--navy);color:#fff;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 2px 16px rgba(0,0,0,0.18)}
.mob-bar .mob-logo{font-family:var(--ff-h);font-size:14px;font-weight:700;letter-spacing:0.4px}
.mob-bar .mob-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);-webkit-tap-highlight-color:transparent}
.mob-bar .mob-btn:active{background:rgba(255,255,255,0.15)}

.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--navy);color:#cdd9e6;z-index:200;display:flex;flex-direction:column;overflow:hidden;box-shadow:2px 0 28px rgba(0,0,0,0.2)}
.side-hd{padding:26px 22px 18px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.07)}
.side-hd h2{font-family:var(--ff-h);font-size:17px;font-weight:700;color:#fff;letter-spacing:0.4px;line-height:1.35}
.side-hd .side-sub{font-size:11px;color:#7888a0;margin-top:5px}
.side-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.12) transparent}
.side-dash{display:block;padding:9px 22px;font-size:13px;color:#a8b8c8;text-decoration:none;border-left:2px solid transparent;cursor:pointer}
.side-dash.act{color:var(--gold);border-left-color:var(--gold)}
.cat-tgl{display:flex;align-items:center;gap:6px;width:100%;padding:10px 22px 4px;background:none;border:none;color:#7888a0;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;cursor:pointer;text-align:left;font-family:var(--ff-b);-webkit-tap-highlight-color:transparent}
.cat-tgl .arr{display:inline-block;transition:transform 0.25s ease;font-size:9px;width:12px;text-align:center}
.cat-tgl.folded .arr{transform:rotate(-90deg)}
.cat-grp{overflow:hidden;transition:max-height 0.3s ease,opacity 0.25s}
.cat-grp.folded{max-height:0!important;opacity:0}
.cat-grp a{display:flex;align-items:center;gap:8px;padding:8px 22px 8px 36px;font-size:12.5px;color:#a0b0c0;text-decoration:none;cursor:pointer;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-tap-highlight-color:transparent}
.cat-grp a.act{color:var(--gold);border-left-color:var(--gold);background:rgba(255,255,255,0.06)}
.cat-grp a .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.side-ft{flex-shrink:0;padding:11px 22px;border-top:1px solid rgba(255,255,255,0.07);font-size:10px;color:#5a6a7a}

.dr-ov{display:none;position:fixed;inset:0;z-index:290;background:rgba(0,0,0,0.5);opacity:0;transition:opacity 0.28s;pointer-events:none}
.dr-ov.show{opacity:1;pointer-events:auto}
.mob-dr{display:none;position:fixed;top:0;left:0;bottom:0;z-index:295;width:280px;max-width:84vw;background:var(--navy);color:#cdd9e6;transform:translateX(-100%);flex-direction:column;overflow:hidden;transition:transform var(--ease)}
.mob-dr.show{transform:translateX(0)}
.mob-dr .dr-hd{padding:18px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mob-dr .dr-hd h2{font-family:var(--ff-h);font-size:16px;color:#fff}
.mob-dr .dr-cls{background:none;border:none;color:#8899aa;font-size:22px;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.mob-dr .side-dash{padding:11px 18px;font-size:14px}
.mob-dr .cat-tgl{padding:11px 18px 4px}
.mob-dr .cat-grp a{padding:9px 18px 9px 32px;font-size:13.5px}

.main-area{margin-left:var(--sidebar-w);padding:30px 36px 80px;max-width:1280px}
.view{display:none}.view.active{display:block}

.d-title{font-family:var(--ff-h);font-size:clamp(21px,3.5vw,30px);font-weight:700;color:var(--navy);letter-spacing:-0.2px;margin-bottom:4px}
@media(prefers-color-scheme:dark){.d-title{color:#c8d8e8}}
.d-sub{font-size:13.5px;color:var(--text-muted);margin-bottom:6px}
.d-hint{font-size:12px;color:var(--accent);margin-bottom:22px;background:var(--accent-bg);padding:8px 14px;border-radius:var(--radius);display:inline-block;max-width:100%}

.stat-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:20px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow-sm)}
.sc .sv{font-family:var(--ff-h);font-size:26px;font-weight:700;color:var(--navy)}
.sc .sl{font-size:11px;color:var(--text-muted);margin-top:2px}

.method-c{background:var(--surface);border:1px solid var(--gold);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.method-c h4{font-family:var(--ff-h);font-size:15px;color:var(--gold);margin-bottom:4px}
.method-c .ms{font-size:11px;color:var(--text-muted);margin-bottom:14px}
.method-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mi{background:var(--gold-bg);border-radius:var(--radius);padding:14px;font-size:12px}
.mi .mf{font-weight:700;color:var(--navy);margin-bottom:3px}
.mi .mw{font-size:10px;color:var(--text-faint)}
.mi .mv{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:2px}
.mi .md{font-size:11px;color:var(--text-muted);line-height:1.5}

/* Data source footer */
.ds-footer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.ds-footer h4{font-family:var(--ff-h);font-size:14px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.ds-item{font-size:12px;color:var(--text-muted);line-height:1.6}
.ds-item strong{color:var(--navy);display:block;margin-bottom:2px;font-size:11px;text-transform:uppercase;letter-spacing:0.3px}
.ds-bar{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text-faint);padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
.ds-bar span{display:inline-flex;align-items:center;gap:4px}
.ds-bar .ds-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-weight:600;font-size:10px}
.ds-active{background:#d4f0dc;color:#15652a}
.ds-refresh{color:var(--accent)}

.oc-tag{display:inline-block;padding:2px 12px;border-radius:12px;font-weight:700;font-size:10px;text-transform:uppercase}
.oc-deep{background:#0d4780;color:#fff}
.oc-shallow{background:#1a6d9a;color:#fff}
.oc-shore{background:#5ea0b8;color:#fff}
.oc-red{background:var(--red);color:#fff}
.oc-grey{background:#bbb;color:#fff}

.hw{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:16px}
.hw-c{background:var(--navy);color:#cdd9e6;padding:12px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hw-c span.srt{font-size:10px;color:#8899aa;font-weight:400}
.scroll-hint{display:none;text-align:center;padding:6px 0 2px;font-size:10px;color:var(--text-faint);letter-spacing:0.3px}
.hs{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;padding-bottom:4px}

.ht{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1080px}
.ht th{padding:9px 7px;text-align:center;font-weight:600;color:var(--text-muted);font-size:9.5px;text-transform:uppercase;letter-spacing:0.3px;border-bottom:2px solid var(--border);background:#faf8f5;position:sticky;top:0;white-space:nowrap}
@media(prefers-color-scheme:dark){.ht th{background:#26292c}}
.ht th:first-child,.ht th:nth-child(2){text-align:left;padding-left:12px}
.ht td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--border);vertical-align:middle}
.ht td:first-child,.ht td:nth-child(2){text-align:left;padding-left:12px}
.ht tbody tr:hover{background:rgba(0,0,0,0.015)}
.ht a{color:var(--navy);text-decoration:none;font-weight:600;font-size:11.5px}
.ht a:hover{color:var(--accent);text-decoration:underline}

.hc{display:inline-block;width:100%;padding:3px 0;border-radius:3px;font-weight:700;font-size:10.5px}
.hc5{background:#1a6b3a;color:#fff}.hc4{background:#3d9b52;color:#fff}
.hc3{background:#ebc944;color:#3a3000}.hc2{background:#e8893a;color:#fff}.hc1{background:#c0392b;color:#fff}
.hd5{background:#1a6b3a;color:#fff}.hd4{background:#3d9b52;color:#fff}
.hd3{background:#ebc944;color:#3a3000}.hd2{background:#e8893a;color:#fff}.hd1{background:#c0392b;color:#fff}

.sc-badge{padding:3px 12px;border-radius:14px;font-weight:700;font-size:12.5px;display:inline-block}
.sc-top{background:var(--green);color:#fff}
.sc-hi{background:#3d9b52;color:#fff}
.sc-md{background:#ebc944;color:#3a3000}
.sc-lo{background:var(--red);color:#fff}

.bo-badge{padding:3px 12px;border-radius:14px;font-weight:700;font-size:12px;display:inline-block}
.bo-deep{background:var(--deep-blue);color:#fff}
.bo-shallow{background:var(--shallow-blue);color:#fff}
.bo-shore{background:var(--shore-blue);color:#fff}
.bo-red{background:var(--red);color:#fff}
.bo-grey{background:#999;color:#fff}

.tag-sm{display:inline-block;padding:1px 8px;border-radius:10px;font-size:9.5px;font-weight:600}
.tag-causal{background:#e8ddf5;color:#5b3a8c}.tag-clinical-db{background:#d8e8f5;color:#2a5e8a}
.tag-survey{background:#d5eee2;color:#38704a}.tag-cohort{background:#f5dede;color:#8a3838}
.tag-clinical{background:#f5eed5;color:#786020}.tag-stats{background:#f0d9e8;color:#8a3868}
.tag-bioinfo{background:#d5e8f0;color:#2a688a}.tag-bioinfo-adv{background:#f5dfcc;color:#885020}
.tag-imaging{background:#e8d5f0;color:#68388a}.tag-tcm{background:#d5efe6;color:#387050}
.tag-ai{background:#f0d5ee;color:#88388a}.tag-biblio{background:#e8e8e8;color:#585858}

.rnk{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;font-weight:700;font-size:10.5px;color:#fff;flex-shrink:0}
.rnk1{background:var(--green)}.rnk2{background:#3d9b52}.rnk3{background:#4a9b5a}.rnk-m{background:var(--accent)}

.if-h{color:var(--green);font-weight:700}
.if-m{color:#8a6a20;font-weight:700}
.if-l{color:var(--text-muted)}

.time-bar{display:inline-flex;align-items:center;gap:3px;min-width:100px}
.time-bar .tbg{position:relative;height:10px;flex:1;background:#e8e4dc;border-radius:5px;overflow:hidden}
.time-bar .tfill{position:absolute;left:0;top:0;height:100%;border-radius:5px;background:linear-gradient(90deg,#7b9bb5 0%,#3d8b52 60%,#1a6b3a 100%)}
.time-bar .tyr{font-size:9.5px;color:var(--text-faint);white-space:nowrap;min-width:28px}
@media(prefers-color-scheme:dark){.time-bar .tbg{background:#3a3d42}}

.trend-icon{font-size:13px}
.ti-exp{color:#1a6b3a}.ti-strong{color:#2d8a4a}.ti-moderate{color:#4a9b5a}
.ti-steady{color:var(--accent)}.ti-plateau{color:var(--text-faint)}.ti-down{color:var(--red)}

.rt-back{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text-muted);font-size:13px;cursor:pointer;text-decoration:none;margin-bottom:22px;-webkit-tap-highlight-color:transparent}
.rt-back:hover{border-color:var(--accent);color:var(--accent)}
.rt-pg-hd{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.rt-ico{width:48px;height:48px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:20px;font-weight:700;background:var(--navy)}
.rt-pg-hd h3{font-family:var(--ff-h);font-size:22px;font-weight:700;color:var(--navy);line-height:1.3}
@media(prefers-color-scheme:dark){.rt-pg-hd h3{color:#c8d8e8}}
.rt-score-line{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.rt-score-line .sc-badge{font-size:16px;padding:4px 16px}
.rt-score-line .bo-badge{font-size:14px;padding:4px 14px}

.rt-mr{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.rt-mb{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 16px;text-align:center;min-width:64px}
.rt-mb .mv{font-size:20px;font-weight:700;color:var(--navy)}
.rt-mb .ml{font-size:10px;color:var(--text-muted);margin-top:2px}

.trend-detail-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.trend-detail-box .t-num{font-family:var(--ff-h);font-size:30px;font-weight:700}
.trend-detail-box .t-desc{font-size:13px;color:var(--text-muted);line-height:1.6}

.rt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:20px}
.rt-c{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.rt-c h4{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.5px}
.rt-c p{font-size:13px;color:var(--text-muted);line-height:1.8}
.rt-c ul{padding-left:18px}.rt-c ul li{font-size:13px;color:var(--text);margin-bottom:3px;line-height:1.6}
.rt-c .slst{list-style:none;padding-left:0}
.rt-c .slst li{padding:4px 0;font-size:12.5px;color:var(--text);border-bottom:1px dotted var(--border)}
.rt-c .slst li .si{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:10px;font-weight:700;margin-right:8px}

.jw{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:20px}
.jt{width:100%;border-collapse:collapse;font-size:13px}
.jt thead{background:#f5f3ee}
@media(prefers-color-scheme:dark){.jt thead{background:#2a2d34}}
.jt th{padding:9px 14px;text-align:left;font-weight:600;color:var(--text-muted);font-size:11px}
.jt td{padding:9px 14px;border-bottom:1px solid var(--border)}
.cq1{color:#15652a;background:#d4f0dc;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.cq2{color:#5a5a18;background:#f0f0d4;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.cq3{color:#786020;background:#f0e0cc;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.cq4{color:#783030;background:#f0d4d4;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.rf-c{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:20px}
.rf-c h4{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.5px}
.rf-c ul{padding-left:20px}
.rf-c ul li{font-size:12px;color:var(--text-muted);margin-bottom:5px;line-height:1.7;word-break:break-word}

@media(max-width:900px){
  .sidebar{display:none}.mob-bar{display:flex}.mob-dr{display:flex}.dr-ov{display:block}
  .main-area{margin-left:0;padding:68px 10px 60px;max-width:100%}
  .rt-grid{grid-template-columns:1fr}.stat-bar{grid-template-columns:repeat(3,1fr)}
  .scroll-hint{display:block}
  .method-g{grid-template-columns:1fr}
  .jw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .jt{min-width:560px}
  .d-title{font-size:19px;line-height:1.3}
  .d-sub{font-size:12px}
  .hw-c{font-size:12px;padding:10px 14px}
  .hw-c span.srt{display:none}
  .ht{min-width:960px;font-size:10.5px}.ht th{padding:7px 5px;font-size:8.5px}.ht td{padding:6px 4px}
  .method-c{padding:16px 14px}
  .method-c h4{font-size:13px}
  .mi{padding:10px}.mi .mv{font-size:16px}.mi .md{font-size:10px}
  .ds-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .stat-bar{grid-template-columns:repeat(2,1fr);gap:7px}
  .sc{padding:10px}.sc .sv{font-size:20px}.sc .sl{font-size:10px}
  .d-title{font-size:17px}
  .rt-pg-hd{flex-direction:column;gap:10px}.rt-pg-hd h3{font-size:17px}
  .rt-mr{gap:6px}.rt-mb{min-width:48px;padding:6px 8px}.rt-mb .mv{font-size:15px}
  .rt-c{padding:12px}.rf-c{padding:12px}
  .ht{min-width:880px;font-size:10px}
  .ds-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="mob-bar"><span class="mob-logo">发文套路图谱</span><button class="mob-btn" id="mobBtn" aria-label="菜单">&#9776;</button></nav>
<div class="dr-ov" id="drOv"></div>
<aside class="mob-dr" id="mobDr"><div class="dr-hd"><h2>35 种套路</h2><button class="dr-cls" id="drCls" aria-label="关闭">&times;</button></div><nav class="side-nav" id="drNav"></nav></aside>

<aside class="sidebar" id="sb"><div class="side-hd"><h2>公共数据库</h2><h2>发文套路图谱</h2><div class="side-sub">35 种套路 &middot; 蓝海指数排序</div></div><nav class="side-nav" id="sNav"></nav><div class="side-ft">数据覆盖 2020 &ndash; 2025</div></aside>

function timeBar(early,late){

}

function trendIcon(g){
  if(g==="exponential")return ['&#9650;&#9650;&#9650;','ti-exp'];
  if(g==="strong_up")return ['&#9650;&#9650;','ti-strong'];
  if(g==="moderate_up")return ['&#9650;','ti-moderate'];
  if(g==="steady_up")return ['&#8599;','ti-steady'];
  if(g==="peak_plateau"||g==="plateau")return ['&#8594;','ti-plateau'];
  if(g==="declining")return ['&#9660;','ti-down'];
  return ['&#8599;','ti-steady'];
}

  h+='<span style="font-weight:700;color:var(--navy)">综合分：</span>';
  h+='<span class="sc-badge sc-top">≥70</span><span style="font-size:10px">强势标的</span>';
  h+='<span class="sc-badge sc-hi">55-69</span><span style="font-size:10px">优质资产</span>';
  h+='<span class="sc-badge sc-md">40-54</span><span style="font-size:10px">合理估值</span>';
  h+='<span class="sc-badge sc-lo">&lt;40</span><span style="font-size:10px">低估/冷门</span>';
  h+='</div>';

  h+='<div class="method-c" style="margin-top:28px"><h4>综合评分计算说明书 (交易视角)</h4><div class="ms">受股市「价值投资 + 成长空间 + 安全边际」框架启发，将每个发文套路视为一支资产标的进行多维打分</div>';
  h+='<div class="method-g">';
  h+='<div class="mi"><div class="mv">IF天花板</div><div class="mf">权重 30%</div><div class="md">对标期刊最高影响因子。IF越高=顶刊越认可="基本面"越强。上限40分封顶。</div></div>';
  h+='<div class="mi"><div class="mv">时效新鲜度</div><div class="mf">权重 25%</div><div class="md">数据是否覆盖到近两年（2020-2025）。越新鲜="安全边际"越高，深耕的时间窗口越长。</div></div>';
  h+='<div class="mi"><div class="mv">创新壁垒</div><div class="mf">权重 20%</div><div class="md">方法学复杂度与新颖度。壁垒越高=竞争对手难以复制="护城河"越宽。</div></div>';
  h+='<div class="mi"><div class="mv">反拥挤度</div><div class="mf">权重 15%</div><div class="md">1 - [发文量拥挤(40%) + 增速拥挤(60%)]。总发文量大且爆发增长=高度拥挤="红海"，需谨慎。</div></div>';
  h+='<div class="mi"><div class="mv">增长健康度</div><div class="mf">权重 10%</div><div class="md">增速太慢=赛道冷清；爆发太快=泡沫风险。温和持续增长最受青睐。稳态上升=0.85，爆发增长仅0.15。</div></div>';
  h+='</div>';
  h+='<div style="margin-top:14px;font-size:11px;color:var(--text-faint);text-align:right">蓝海指数 = IF天花板*0.30 + 时效新鲜度*0.25 + 创新壁垒*0.20 + 反拥挤度*0.15 + 增长健康度*0.10 &nbsp;|&nbsp; 综合评分 = 蓝海指数*0.60 + 传统评分*0.40</div>';
  h+='</div>';

  h+='<div class="ds-footer" style="margin-top:20px"><h4>数据来源与自动更新</h4>';
  h+='<div class="ds-grid">';
  h+='<div class="ds-item"><strong>期刊数据</strong>PubMed, Web of Science, 期刊官网 (IF/分区/发文量)</div>';
  h+='<div class="ds-item"><strong>数据库覆盖</strong>GWAS Catalog, TCGA, GEO, UK Biobank, NHANES, SEER, MIMIC, GBD 等</div>';
  h+='<div class="ds-item"><strong>趋势分析</strong>PubMed检索量 &amp; 发文增速 (2020&ndash;2025)</div>';
  h+='<div class="ds-item"><strong>评分模型</strong>蓝海指数 (交易视角) + 传统六维评分</div>';
  h+='</div>';
  h+='<div class="ds-bar">';
  h+='<span><span class="ds-badge ds-active">激活</span> 数据覆盖 2020 &ndash; 2025</span>';
  h+='<span>上次更新: <strong>2026-06-17</strong></span>';
  h+='<span class="ds-refresh">自动刷新: 每周一 UTC 02:00 (GitHub Actions)</span>';
  h+='</div></div>';

  v.innerHTML=h;
}

function showRt(rid){
  var r=rm[rid];if(!r)return;
  var ma=document.getElementById('mainArea');
  var view=document.getElementById('v-'+rid);
  if(!view){
    view=document.createElement('section');view.className='view';view.id='v-'+rid;ma.appendChild(view);
    var cat=r.category;
    var t=trendIcon(r.trend_growth);
    var h='<button class="rt-back" onclick="showDash()">&larr; 返回总览</button>';
    h+='<div class="rt-pg-hd"><div class="rt-ico">'+(IM[cat]||cat[0])+'</div><div><h3>'+r.name+'</h3><div class="rt-score-line"><span class="bo-badge '+boCls(r.ocean_label)+'">蓝海 '+r.blue_ocean+'</span><span class="sc-badge '+scCls(r.composite)+'">综合 '+r.composite+'</span><span class="tag-sm '+(TM[cat]||"")+'">'+cat+'</span></div></div></div>';

    h+='<div class="rt-mr">';
    h+='<div class="rt-mb"><div class="mv">'+r.difficulty_write+'/5</div><div class="ml">成文难度</div></div>';
    h+='<div class="rt-mb"><div class="mv">'+r.difficulty_pub+'/5</div><div class="ml">发文难度</div></div>';
    h+='<div class="rt-mb"><div class="mv">'+r.innovation+'/5</div><div class="ml">创新性</div></div>';
    h+='<div class="rt-mb"><div class="mv">'+r.hotness+'/5</div><div class="ml">热度</div></div>';
    h+='<div class="rt-mb"><div class="mv">'+r.earliest_year+'-'+r.latest_year+'</div><div class="ml">数据时段</div></div>';
    h+='<div class="rt-mb"><div class="mv" style="color:'+(r.crowd_index>0.5?'var(--red)':'var(--green)')+'">'+(r.crowd_index*100).toFixed(0)+'%</div><div class="ml">拥挤度</div></div>';
    h+='</div>';

    h+='<div class="trend-detail-box"><div class="t-num" style="color:var(--deep-blue)">'+r.blue_ocean+'</div><div class="t-desc"><strong>蓝海指数: '+r.ocean_label+'</strong><br>IF天花板: '+r.max_if.toFixed(1)+' | 新鲜度: '+(r.freshness_raw*100).toFixed(0)+'% | 创新壁垒: '+(r.innovation_barrier*100).toFixed(0)+'% | 拥挤度: '+(r.crowd_index*100).toFixed(0)+'% | 增长健康: '+(r.growth_health*100).toFixed(0)+'%</div></div>';

    h+='<div class="trend-detail-box"><div class="t-num" style="color:var(--accent)">'+r.trend_pct+'</div><div class="t-desc"><strong>发文趋势 (2020&ndash;2025)</strong><br>'+r.trend_desc+'</div></div>';

    h+='<div class="rt-grid">';
    h+='<div class="rt-c"><h4>核心套路</h4><p>'+r.core+'</p></div>';
    h+='<div class="rt-c"><h4>常用数据库</h4><ul>'+r.databases.map(function(d){return'<li>'+d+'</li>'}).join('')+'</ul></div>';
    h+='<div class="rt-c"><h4>分析流程</h4><ul class="slst">'+r.flow.map(function(s,i){return'<li><span class="si">'+(i+1)+'</span>'+s+'</li>'}).join('')+'</ul></div>';
    h+='</div>';

    h+='<div class="jw"><table class="jt"><thead><tr><th>期刊</th><th>IF</th><th>分区</th><th>发文量</th><th>覆盖时段</th></tr></thead><tbody>';
    r.journals.forEach(function(j){h+='<tr><td style="font-weight:600">'+j.name+'</td><td style="font-weight:700">'+j.if+'</td><td><span class="'+casCls(j.cas)+'">'+j.cas+'</span></td><td>'+j.pub_count+'</td><td>'+j.period+'</td></tr>'});
    h+='</tbody></table></div>';

    h+='<div class="rf-c"><h4>关键参考文献</h4><ul>';
    r.references.forEach(function(ref){h+='<li>'+ref+'</li>'});
    h+='</ul></div>';
    view.innerHTML=h;
  }

  document.querySelectorAll('#mainArea > .view').forEach(function(vv){vv.classList.remove('active')});
  view.classList.add('active');
  safeScroll(view);
  document.querySelectorAll('#sNav a,#drNav a').forEach(function(a){a.classList.remove('act')});
  var nl=document.querySelector('#sNav a[data-rid="'+rid+'"],#drNav a[data-rid="'+rid+'"]');
  if(nl)nl.classList.add('act');
  document.querySelectorAll('#sNav .side-dash,#drNav .side-dash').forEach(function(d){d.classList.remove('act')});
  if(window.innerWidth<=900)closeDr();
}

function showDash(){
  buildDash();
  var dash=document.getElementById('v-dash');
  document.querySelectorAll('#mainArea > .view').forEach(function(vv){vv.classList.remove('active')});
  dash.classList.add('active');
  safeScroll(dash);
  document.querySelectorAll('#sNav a,#drNav a').forEach(function(a){a.classList.remove('act')});
  document.querySelectorAll('#sNav .side-dash,#drNav .side-dash').forEach(function(d){d.classList.add('act')});
  if(window.innerWidth<=900)closeDr();
}

function setupTgl(el){
  el.querySelectorAll('.cat-tgl').forEach(function(btn){btn.addEventListener('click',function(e){e.preventDefault();var c=this.dataset.cat;var g=document.getElementById('cg-'+c);if(!g)return;this.classList.toggle('folded');g.classList.toggle('folded');this.setAttribute('aria-expanded',String(!this.classList.contains('folded')))})});
}

function openDr(){document.getElementById('drOv').classList.add('show');document.getElementById('mobDr').classList.add('show');document.body.style.overflow='hidden'}
function closeDr(){document.getElementById('drOv').classList.remove('show');document.getElementById('mobDr').classList.remove('show');document.body.style.overflow=''}
function init(){
  var sN=document.getElementById('sNav'),dN=document.getElementById('drNav');
  buildNav(sN);buildNav(dN);setupTgl(sN);setupTgl(dN);
  document.getElementById('mobBtn').addEventListener('click',function(e){e.preventDefault();openDr()});
  document.getElementById('drCls').addEventListener('click',function(e){e.preventDefault();closeDr()});
  document.getElementById('drOv').addEventListener('click',closeDr);
  var mdr=document.getElementById('mobDr');
  mdr.addEventListener('click',function(e){if(e.target===mdr)closeDr()});
  dN.addEventListener('click',function(e){if(e.target.closest('a')||e.target.closest('.side-dash'))setTimeout(closeDr,220)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDr()});
  var tX=0;mdr.addEventListener('touchstart',function(e){tX=e.touches[0].clientX},false);
  mdr.addEventListener('touchmove',function(e){if(e.touches[0].clientX-tX<-40)closeDr()},false);
  buildDash();
}
init();
</script>
</body>
</html>
